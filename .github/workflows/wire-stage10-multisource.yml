name: Wire Stage 10 multi-source search
on:
  push:
    branches: [stage-10-multisource-jobdatalake]
    paths:
      - '.github/workflows/wire-stage10-multisource.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-10-multisource-jobdatalake
      - name: Wire cache version and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='stage6.js?v=23'
          new='stage6.js?v=25'
          if old not in s and new not in s:
              raise SystemExit('stage6 loader not found')
          p.write_text(s.replace(old,new))
          PY
          node --check stage10multi.js
          node --check stage6.js
          grep -q 'stage10multi.js?v=25' stage6.js
          grep -q 'stage6.js?v=25' index.html
      - name: Commit wiring
        run: |
          git config user.name "Glenn Adriel Mendonca"
          git config user.email "75622417+glenn169@users.noreply.github.com"
          git add -- index.html
          if ! git diff --cached --quiet; then
            git commit -m "Wire Stage 10 multi-source frontend"
          fi
          git push
      - name: Remove one-time workflow
        run: |
          git rm -- .github/workflows/wire-stage10-multisource.yml
          git commit -m "Remove one-time Stage 10 multi-source workflow"
          git push
