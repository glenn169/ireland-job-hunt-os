name: Fix CV summary generator

on:
  push:
    branches:
      - fix-cv-summary-generator

permissions:
  contents: write

jobs:
  fix-summary:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-cv-summary-generator
          fetch-depth: 0
      - name: Replace weak summary logic
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('stage7.js')
          text = p.read_text()

          marker = 'function s7TailorJob(job, profile){\n'
          helpers = r'''function s7IsCvMeta(value){
  const text=String(value||"").trim();
  if(!text)return true;
  return /(?:^|\b)(?:ats|match|keyword evidence|selected job|current match|experience\s*:|score|coverage)\b/i.test(text)
    || /^\d+(?:\.\d+)?%$/.test(text)
    || /(?:^|\s)\d+(?:\.\d+)?%\s*(?:and|$)/i.test(text)
    || /^candidate targeting\b/i.test(text);
}

function s7CleanEvidenceTerm(value){
  const text=String(value||"").replace(/\s+/g," ").trim().replace(/[;,.]+$/g,"");
  if(!text||s7IsCvMeta(text)||text.length<2||text.length>80)return "";
  if(/^(?:experience|skills?|qualifications?|requirements?|create|role|job)$/i.test(text))return "";
  return text;
}

function s7OriginalSummary(profile){
  const raw=String(profile.resumeText||"");
  if(!raw)return "";
  const lines=raw.split(/\r?\n/).map(v=>v.replace(/\s+/g," ").trim()).filter(Boolean);
  const start=lines.findIndex(line=>/^(professional summary|profile|personal profile|career profile|career summary|summary|objective)\s*:?$/i.test(line));
  if(start<0)return "";
  const stop=/^(technical skills|skills|key skills|core skills|professional skills|certifications|professional experience|work experience|employment|education|projects|achievements|additional information|languages)\s*:?$/i;
  const out=[];
  for(let i=start+1;i<lines.length;i++){
    if(stop.test(lines[i]))break;
    out.push(lines[i]);
  }
  return out.join(" ").replace(/\s+/g," ").trim();
}

function s7BestYears(profile){
  const source=[profile.resumeText,profile.experienceSummary].filter(Boolean).join(" ");
  const found=[...source.matchAll(/\b(?:over\s+|more than\s+)?(\d{1,2})\+?\s+years?(?:\s+of)?(?:\s+(?:hands-on|professional|relevant|work))?\s+experience\b/gi)]
    .map(m=>Number(m[1])).filter(n=>n>0&&n<60);
  const saved=Number(String(profile.yearsExperience||"").match(/\d{1,2}/)?.[0]||0);
  if(saved>0)found.push(saved);
  return found.length?Math.max(...found):null;
}

function s7SummaryIdentity(profile){
  const original=s7OriginalSummary(profile);
  if(original){
    const first=(original.match(/^(.{20,220}?[.!?])(?:\s|$)/)||[])[1]||"";
    if(first&&!s7IsCvMeta(first))return first.replace(/[.!?]+$/," ").trim();
  }
  const target=s7Split(profile.targetRoles)[0];
  if(target)return `${target} professional`;
  return "Professional";
}

function s7EducationCue(profile){
  const source=[profile.education,profile.resumeText].filter(Boolean).join("\n");
  const lines=source.split(/\r?\n/).map(v=>v.replace(/\s+/g," ").trim()).filter(Boolean);
  return lines.find(line=>/\b(?:master|msc|bachelor|bsc|mba|degree|diploma|phd|doctorate)\b/i.test(line)&&line.length<=180)||"";
}

function s7RelevantProfileTerms(profile,job,matchedSkills){
  const profileTerms=s7Split(profile.professionalSkills).map(s7CleanEvidenceTerm).filter(Boolean);
  const softTerms=s7Split(profile.softSkills).map(s7CleanEvidenceTerm).filter(Boolean);
  const terms=s7Unique([...matchedSkills,...profileTerms,...softTerms]).map(s7CleanEvidenceTerm).filter(Boolean);
  const jobTerms=s7Unique([job.position,...s7Split(job.requiredSkills),...s7ParseAnalyzerNotes(job.notes).keywords]).map(s7CleanEvidenceTerm).filter(Boolean);
  return terms.map((term,index)=>({term,index,score:s7LineScore(term,jobTerms)}))
    .sort((a,b)=>b.score-a.score||a.index-b.index)
    .map(x=>x.term).slice(0,9);
}

function s7AchievementEvidence(profile,job,rankingTerms){
  return s7CandidateEvidenceLines(profile)
    .filter(line=>!s7IsCvMeta(line)&&/\b\d+(?:[.,]\d+)?(?:%|\+)?\b/.test(line))
    .map(line=>({line:line.replace(/\s+/g," ").trim(),score:s7LineScore(line,[...rankingTerms,job.position])}))
    .filter(item=>item.score>0)
    .sort((a,b)=>b.score-a.score)
    .map(item=>item.line)
    .filter((line,index,arr)=>arr.findIndex(v=>s7Normalise(v)===s7Normalise(line))===index)
    .slice(0,2);
}

function s7Sentence(value,max=260){
  let text=String(value||"").replace(/^[•*\-–—\s]+/,"").replace(/\s+/g," ").trim();
  if(!text)return "";
  if(text.length>max)text=text.slice(0,max).replace(/\s+\S*$/,'').trim();
  if(!/[.!?]$/.test(text))text+='.';
  return text;
}

function s7BuildEvidenceSummary(job,profile,matchedSkills,matchedQualifications,matchedRequirements){
  const years=s7BestYears(profile);
  const identity=s7SummaryIdentity(profile);
  const relevant=s7RelevantProfileTerms(profile,job,matchedSkills);
  const ranking=s7Unique([...relevant,...matchedQualifications,...matchedRequirements]).map(s7CleanEvidenceTerm).filter(Boolean);
  const achievements=s7AchievementEvidence(profile,job,ranking);
  const education=s7EducationCue(profile);
  const sentences=[];

  let opener=identity;
  if(years&&!new RegExp(`\\b${years}\\+?\\s+years?\\b`,`i`).test(opener)) opener+=` with over ${years} years of hands-on experience`;
  if(relevant.length){
    const focus=relevant.slice(0,5).join(", ");
    opener+= opener.toLowerCase().includes("experience")?` across ${focus}`:` with practical experience across ${focus}`;
  }
  sentences.push(s7Sentence(opener,330));

  if(relevant.length>5){sentences.push(s7Sentence(`Additional hands-on knowledge includes ${relevant.slice(5,9).join(", ")}`,260));}
  achievements.forEach(item=>sentences.push(s7Sentence(item,300)));

  if(education&&!sentences.some(s=>s7Normalise(s).includes(s7Normalise(education)))){
    sentences.push(s7Sentence(`Academic background includes ${education.replace(/^[•*\-–—\s]+/,"")}`,230));
  }

  sentences.push(s7Sentence(`Seeking to apply this technical and professional background in a ${job.position} role`,180));

  let summary=sentences.filter(Boolean).join(" ").replace(/\s+/g," ").trim();
  const words=summary.split(/\s+/);
  if(words.length>135)summary=words.slice(0,135).join(" ").replace(/[,;:]?\s*$/,'')+'.';
  return summary;
}

'''
          if helpers.strip() not in text:
              text = text.replace(marker, helpers + marker)

          old = '''  const topSkills = matchedSkills.slice(0,6);\n  const years = String(profile.yearsExperience || "").trim();\n  const certs = matchedQualifications.slice(0,2);\n  const summaryParts = [];\n  if(years) summaryParts.push(`${years} years of experience`);\n  if(topSkills.length) summaryParts.push(`evidence in ${topSkills.slice(0,4).join(", ")}`);\n  if(certs.length) summaryParts.push(certs.join(" and "));\n  const summary = summaryParts.length\n    ? `Candidate targeting ${job.position} with ${summaryParts.join("; ")}. This draft uses only information already present in the saved profile and should be edited for tone before use.`\n    : `Target role: ${job.position}. Add a concise summary using only verified evidence from your saved profile.`;\n'''
          new = '''  const summary = s7BuildEvidenceSummary(job,profile,matchedSkills,matchedQualifications,matchedRequirements);\n'''
          if old not in text:
              raise SystemExit('Expected old summary block not found')
          text = text.replace(old,new)
          p.write_text(text)

          # Force the browser to fetch the new summary engine.
          idx=Path('index.html'); t=idx.read_text().replace('stage6.js?v=18','stage6.js?v=19'); idx.write_text(t)
          loader=Path('stage6.js'); t=loader.read_text().replace('?v=18','?v=19'); loader.write_text(t)
          PY
      - name: Validate JavaScript and filters
        run: |
          node --check stage7.js
          node --check stage6.js
          grep -q 's7BuildEvidenceSummary' stage7.js
          grep -q 's7BestYears' stage7.js
          grep -q 's7IsCvMeta' stage7.js
          ! grep -q 'Candidate targeting ${job.position}' stage7.js
          grep -q 'stage6.js?v=19' index.html
          grep -q 'stage7.js?v=19' stage6.js
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/fix-cv-summary-generator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- stage7.js stage6.js index.html .github/workflows/fix-cv-summary-generator.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Improve evidence-based CV summary generation'
          git push origin HEAD:fix-cv-summary-generator
