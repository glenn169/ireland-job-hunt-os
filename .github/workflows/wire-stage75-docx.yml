name: Wire Stage 7.5 DOCX tailoring

on:
  push:
    branches:
      - stage-7-5-master-cv-document-tailoring

permissions:
  contents: write

jobs:
  wire:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-7-5-master-cv-document-tailoring
          fetch-depth: 0
      - name: Wire Stage 7.5
        run: |
          python - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          text=index.read_text()
          text=text.replace('stage6.js?v=16','stage6.js?v=17')
          index.write_text(text)

          stage6=Path('stage6.js')
          text=stage6.read_text()
          text=text.replace('?v=16','?v=17')
          old='"stage74bootstrap.js?v=17"]'
          new='"stage74bootstrap.js?v=17","stage75docx.js?v=17"]'
          if old not in text:
              raise SystemExit('Could not find Stage 7.4 loader marker')
          text=text.replace(old,new)
          stage6.write_text(text)

          bootstrap=Path('stage74bootstrap.js')
          text=bootstrap.read_text().replace('stage74.js?v=16','stage74.js?v=17')
          bootstrap.write_text(text)

          stage74=Path('stage74.js')
          text=stage74.read_text()
          marker='if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",s74Init);else s74Init();'
          bridge='''window.JobHuntCloudCV={\n  getClient:s74GetClient,\n  getSession:()=>s74Session,\n  getActiveMaster:()=>s74ActiveMaster,\n  bucket:S74_BUCKET,\n  openMaster:s74OpenMaster,\n  refreshHistory:s74LoadHistory\n};\n\n'''
          if 'window.JobHuntCloudCV=' not in text:
              if marker not in text:
                  raise SystemExit('Could not find Stage 7.4 init marker')
              text=text.replace(marker,bridge+marker)
          stage74.write_text(text)
          PY
      - name: Verify JavaScript and loader chain
        run: |
          node --check stage75docx.js
          node --check stage74.js
          node --check stage6.js
          node --check stage74bootstrap.js
          grep -q 'stage6.js?v=17' index.html
          grep -q 'stage75docx.js?v=17' stage6.js
          grep -q 'stage74.js?v=17' stage74bootstrap.js
          grep -q 'window.JobHuntCloudCV=' stage74.js
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/wire-stage75-docx.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html stage6.js stage74bootstrap.js stage74.js stage75docx.js .github/workflows/wire-stage75-docx.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Wire Stage 7.5 Master CV document tailoring'
          git push origin HEAD:stage-7-5-master-cv-document-tailoring
