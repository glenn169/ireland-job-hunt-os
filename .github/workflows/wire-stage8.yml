name: Wire Stage 8 follow-up system

on:
  push:
    branches:
      - stage-8-follow-up-system-v3

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-8-follow-up-system-v3
      - name: Wire parent loader and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="stage6.js?v=19"></script>'
          new='<script src="stage6.js?v=20"></script>'
          if old not in s:
              raise SystemExit('Expected v19 parent loader not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check stage8.js
          node --check stage6.js
          grep -q 'stage8.js?v=20' stage6.js
          grep -q 'stage6.js?v=20' index.html
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/wire-stage8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html .github/workflows/wire-stage8.yml
          git commit -m "Finalize Stage 8 loader wiring"
          git push origin HEAD:stage-8-follow-up-system-v3
