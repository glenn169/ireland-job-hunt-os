name: Wire Stage 10 live job discovery
on:
  push:
    branches: [stage-10-live-job-discovery]
    paths: ['.github/workflows/wire-stage10.yml']
permissions:
  contents: write
jobs:
  wire-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-10-live-job-discovery
      - name: Wire index cache and verify JavaScript
        run: |
          set -e
          sed -i 's/stage6.js?v=21/stage6.js?v=22/g' index.html
          node --check stage10.js
          node --check stage6.js
          grep -q 'stage10.js?v=22' stage6.js
          grep -q 'stage6.js?v=22' index.html
          grep -q 'search-jobs' stage10.js
      - name: Commit wiring
        run: |
          git config user.name "Glenn Adriel Mendonca"
          git config user.email "75622417+glenn169@users.noreply.github.com"
          git add -- index.html
          if ! git diff --cached --quiet; then git commit -m "Activate Stage 10 live job discovery"; git push; fi
      - name: Remove one-time workflow
        run: |
          git pull --ff-only
          git rm .github/workflows/wire-stage10.yml
          git commit -m "Remove one-time Stage 10 wiring workflow"
          git push
