name: Apply CV summary fix

on:
  push:
    branches:
      - fix-cv-summary-generator

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-cv-summary-generator
          fetch-depth: 0
      - name: Write summary module and bump loader
        shell: bash
        run: |
          cat > stage7summary.js <<'EOF'
          "use strict";

          /* Evidence-rich CV summary override for Stage 7 / Stage 7.5. */
          (function installEvidenceSummary(){
            const META_RX=/(?:^|\b)(?:ats|match|keyword evidence|selected job|current match|experience\s*:|score|coverage)\b/i;
            const clean=v=>String(v||"").replace(/\s+/g," ").trim();
            const split=v=>String(v||"").split(/,|\n|\|/).map(clean).filter(Boolean);
            const uniq=arr=>[...new Set(arr.filter(Boolean))];
            const norm=v=>clean(v).toLowerCase().replace(/[^a-z0-9+#. ]/g," ").replace(/\s+/g," ").trim();
            const bad=v=>{const t=clean(v);return !t||META_RX.test(t)||/^\d+(?:\.\d+)?%$/.test(t)||/^candidate targeting\b/i.test(t)||/^(?:experience|skills?|qualifications?|requirements?|create|role|job)$/i.test(t);};
            const safe=v=>{const t=clean(v).replace(/[;,.]+$/g,"");return bad(t)||t.length>90?"":t;};
            const sentence=(v,max=300)=>{let t=clean(v).replace(/^[•*\-–—\s]+/,"");if(!t)return "";if(t.length>max)t=t.slice(0,max).replace(/\s+\S*$/,'').trim();if(!/[.!?]$/.test(t))t+=".";return t;};

            function originalSummary(profile){
              const raw=String(profile?.resumeText||"");
              const lines=raw.split(/\r?\n/).map(clean).filter(Boolean);
              const start=lines.findIndex(line=>/^(professional summary|profile|personal profile|career profile|career summary|summary|objective)\s*:?$/i.test(line));
              if(start<0)return "";
              const stop=/^(technical skills|skills|key skills|core skills|professional skills|certifications|professional experience|work experience|employment|education|projects|achievements|additional information|languages)\s*:?$/i;
              const out=[];
              for(let i=start+1;i<lines.length;i++){if(stop.test(lines[i]))break;out.push(lines[i]);}
              return clean(out.join(" "));
            }

            function bestYears(profile){
              const source=[profile?.resumeText,profile?.experienceSummary].filter(Boolean).join(" ");
              const nums=[...source.matchAll(/\b(?:over\s+|more than\s+)?(\d{1,2})\+?\s+years?(?:\s+of)?(?:\s+(?:hands-on|professional|relevant|work))?\s+experience\b/gi)].map(m=>Number(m[1])).filter(n=>n>0&&n<60);
              const saved=Number(String(profile?.yearsExperience||"").match(/\d{1,2}/)?.[0]||0);if(saved)nums.push(saved);
              return nums.length?Math.max(...nums):null;
            }

            function identity(profile){
              const orig=originalSummary(profile);
              const first=(orig.match(/^(.{20,240}?[.!?])(?:\s|$)/)||[])[1]||"";
              if(first&&!bad(first))return first.replace(/[.!?]+$/,'').trim();
              const target=split(profile?.targetRoles)[0];
              return target?`${target} professional`:"Professional";
            }

            function jobTerms(job){
              const terms=[job?.position,...split(job?.requiredSkills)];
              const notes=String(job?.notes||"");
              ["ATS keywords","Qualifications","Key requirements"].forEach(label=>{
                const m=notes.match(new RegExp(`${label}:\\s*([^\\n]+)`,`i`));
                if(m)terms.push(...m[1].split(/,|\|/));
              });
              return uniq(terms.map(safe).filter(Boolean));
            }

            function overlapScore(text,terms){
              const n=norm(text);let score=0;
              for(const term of terms){const t=norm(term);if(!t)continue;if(n.includes(t)||t.includes(n))score+=6;else score+=t.split(" ").filter(w=>w.length>2&&n.includes(w)).length;}
              return score;
            }

            function relevantTerms(profile,job,base){
              const pool=uniq([...(base?.matchedSkills||[]),...split(profile?.professionalSkills),...split(profile?.softSkills)]).map(safe).filter(Boolean);
              const terms=jobTerms(job);
              return pool.map((term,index)=>({term,index,score:overlapScore(term,terms)})).sort((a,b)=>b.score-a.score||a.index-b.index).map(x=>x.term).slice(0,9);
            }

            function evidenceLines(profile){
              const raw=[profile?.experienceSummary,profile?.resumeText].filter(Boolean).join("\n");
              return uniq(raw.split(/\r?\n|(?<=[.!?])\s+(?=[A-Z])/).map(line=>clean(line.replace(/^[•*\-–—\s]+/,""))).filter(line=>line.length>=30&&line.length<=340&&!bad(line)));
            }

            function achievements(profile,job,terms){
              return evidenceLines(profile).filter(line=>/\b\d+(?:[.,]\d+)?(?:%|\+)?\b/.test(line)).map((line,index)=>({line,index,score:overlapScore(line,[...terms,...jobTerms(job)])})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.index-b.index).map(x=>x.line).slice(0,2);
            }

            function educationCue(profile){
              const lines=[profile?.education,profile?.resumeText].filter(Boolean).join("\n").split(/\r?\n/).map(clean).filter(Boolean);
              return lines.find(line=>/\b(?:master|msc|bachelor|bsc|mba|degree|diploma|phd|doctorate)\b/i.test(line)&&line.length<=180)||"";
            }

            function build(job,profile,base){
              const years=bestYears(profile);const rel=relevantTerms(profile,job,base);const id=identity(profile);const out=[];
              let opener=id;
              if(years&&!new RegExp(`\\b${years}\\+?\\s+years?\\b`,`i`).test(opener))opener+=` with over ${years} years of hands-on experience`;
              if(rel.length){const focus=rel.slice(0,5).join(", ");opener+=/experience/i.test(opener)?` across ${focus}`:` with practical experience across ${focus}`;}
              out.push(sentence(opener,340));
              if(rel.length>5)out.push(sentence(`Additional hands-on knowledge includes ${rel.slice(5,9).join(", ")}`,260));
              achievements(profile,job,rel).forEach(a=>out.push(sentence(a,310)));
              const edu=educationCue(profile);if(edu&&!out.some(s=>norm(s).includes(norm(edu))))out.push(sentence(`Academic background includes ${edu}`,220));
              out.push(sentence(`Seeking to apply this technical and professional background in a ${job?.position||"target"} role`,180));
              let summary=out.filter(Boolean).join(" ").replace(/\s+/g," ").trim();
              const words=summary.split(/\s+/);if(words.length>135)summary=words.slice(0,135).join(" ").replace(/[,;:]?\s*$/,'')+'.';
              return summary;
            }

            function install(){
              if(typeof s7TailorJob!=="function")return false;
              if(window.__s7EvidenceSummaryInstalled)return true;
              const original=s7TailorJob;
              s7TailorJob=function(job,profile){const result=original(job,profile);result.summary=build(job,profile,result);return result;};
              window.__s7EvidenceSummaryInstalled=true;
              return true;
            }

            if(!install()){
              let tries=0;const timer=setInterval(()=>{tries++;if(install()||tries>100)clearInterval(timer);},100);
            }
          })();
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('stage6.js')
          t=p.read_text()
          t=t.replace('"stage7.js?v=18",','"stage7.js?v=19","stage7summary.js?v=19",')
          t=t.replace('?v=18','?v=19')
          p.write_text(t)
          p=Path('index.html')
          t=p.read_text().replace('stage6.js?v=18','stage6.js?v=19')
          p.write_text(t)
          PY
      - name: Validate
        run: |
          node --check stage7summary.js
          node --check stage6.js
          grep -q 'stage7summary.js?v=19' stage6.js
          grep -q 'stage6.js?v=19' index.html
          grep -q '__s7EvidenceSummaryInstalled' stage7summary.js
          ! grep -q 'Candidate targeting' stage7summary.js
      - name: Commit final fix
        run: |
          rm .github/workflows/apply-cv-summary-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- stage7summary.js stage6.js index.html .github/workflows/apply-cv-summary-fix.yml
          git commit -m 'Improve CV summary generation from full evidence'
          git push origin HEAD:fix-cv-summary-generator
