name: Fix Stage 7.5 injection

on:
  push:
    branches:
      - fix-stage-7-5-injection

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-stage-7-5-injection
          fetch-depth: 0
      - name: Apply targeted Stage 7.5 fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('stage75docx.js')
          text = p.read_text()
          old = '  page.insertBefore(panel,legacy);s75Legacy(false);'
          new = '  const parent=legacy.parentNode||page;parent.insertBefore(panel,legacy);s75Legacy(false);'
          if old not in text:
              raise SystemExit('Expected Stage 7.5 injection line not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          s6 = Path('stage6.js')
          text = s6.read_text().replace('?v=17','?v=18')
          s6.write_text(text)

          index = Path('index.html')
          text = index.read_text().replace('stage6.js?v=17','stage6.js?v=18')
          index.write_text(text)

          boot = Path('stage74bootstrap.js')
          text = boot.read_text().replace('stage74.js?v=17','stage74.js?v=18')
          boot.write_text(text)
          PY
      - name: Verify
        run: |
          grep -q 'const parent=legacy.parentNode||page;parent.insertBefore(panel,legacy);s75Legacy(false);' stage75docx.js
          grep -q 'stage75docx.js?v=18' stage6.js
          grep -q 'stage6.js?v=18' index.html
          grep -q 'stage74.js?v=18' stage74bootstrap.js
          node --check stage75docx.js
          node --check stage6.js
          node --check stage74bootstrap.js
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/fix-stage75-injection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- stage75docx.js stage6.js index.html stage74bootstrap.js .github/workflows/fix-stage75-injection.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Stage 7.5 document tailoring injection'
          git push origin HEAD:fix-stage-7-5-injection
