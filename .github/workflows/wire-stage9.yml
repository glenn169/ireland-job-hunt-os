name: Wire Stage 9 daily workflow

on:
  push:
    branches:
      - stage-9-daily-job-hunt-v3

permissions:
  contents: write

jobs:
  wire-stage9:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-9-daily-job-hunt-v3
      - name: Verify and wire Stage 9
        run: |
          node --check stage9.js
          node --check stage6.js
          grep -q 'stage9.js?v=21' stage6.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'stage6.js?v=20' in s:
              s=s.replace('stage6.js?v=20','stage6.js?v=21')
          elif 'stage6.js?v=21' not in s:
              raise SystemExit('Expected stage6 loader version not found')
          p.write_text(s)
          PY
          grep -q 'stage6.js?v=21' index.html
      - name: Commit verified wiring and remove workflow
        run: |
          rm .github/workflows/wire-stage9.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html stage6.js stage9.js .github/workflows/wire-stage9.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Verify Stage 9 daily workflow wiring'
            git push origin HEAD:stage-9-daily-job-hunt-v3
          fi
