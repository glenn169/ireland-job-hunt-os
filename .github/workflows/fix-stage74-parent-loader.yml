name: Fix Stage 7.4 parent loader

on:
  push:
    branches:
      - fix-stage-7-4-parent-loader

permissions:
  contents: write

jobs:
  fix-loader:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-stage-7-4-parent-loader
          fetch-depth: 0
      - name: Apply loader fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('profile.js?v=12', 'profile.js?v=16')
          text = text.replace('stage6.js?v=12', 'stage6.js?v=16')
          index.write_text(text)

          profile = Path('profile.js')
          text = profile.read_text()
          marker = '\n/* Stage 6 loader - kept separate so Stage 5 profile/CV code remains isolated. */\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          profile.write_text(text)

          stage6 = Path('stage6.js')
          text = stage6.read_text()
          text = text.replace('?v=15', '?v=16').replace('?v=14', '?v=16')
          stage6.write_text(text)

          bootstrap = Path('stage74bootstrap.js')
          text = bootstrap.read_text().replace('stage74.js?v=15', 'stage74.js?v=16').replace('stage74.js?v=14', 'stage74.js?v=16')
          bootstrap.write_text(text)
          PY
      - name: Verify exact loader state
        run: |
          grep -q 'profile.js?v=16' index.html
          grep -q 'stage6.js?v=16' index.html
          ! grep -q 'stage6.js?v=8' profile.js
          grep -q 'stage74bootstrap.js?v=16' stage6.js
          grep -q 'stage74.js?v=16' stage74bootstrap.js
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-stage74-parent-loader.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html profile.js stage6.js stage74bootstrap.js .github/workflows/fix-stage74-parent-loader.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Stage 7.4 parent loader chain'
          git push origin HEAD:fix-stage-7-4-parent-loader
